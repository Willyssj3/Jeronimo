name: Pruebas e instalador de Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Versión a publicar en Releases (por ejemplo v0.2.0). Vacío: solo compilar."
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-spa
          pip install -e ".[dev]"
      - name: Pruebas
        run: python -m pytest -q

  windows:
    needs: pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ".[escritorio]" pyinstaller
      - name: Versión
        shell: bash
        run: echo "VERSION=$(python -c 'import traductor; print(traductor.__version__)')" >> "$GITHUB_ENV"
      - name: Comprobar la versión a publicar
        if: github.event_name == 'workflow_dispatch' && inputs.publicar != ''
        shell: bash
        env:
          PUBLICAR: ${{ inputs.publicar }}
        run: |
          if [ "$PUBLICAR" != "v$VERSION" ]; then
            echo "Se pidió publicar $PUBLICAR, pero el código es la versión $VERSION."
            exit 1
          fi
          test -f "docs/versiones/$PUBLICAR.md" || { echo "Faltan las notas docs/versiones/$PUBLICAR.md"; exit 1; }
      - name: Probar el OCR de Windows
        continue-on-error: true
        run: python packaging\prueba_ocr_windows.py
      - name: Construir la app (PyInstaller)
        working-directory: packaging
        run: pyinstaller --noconfirm --distpath ..\dist --workpath ..\build Jeronimo.spec
      - name: Comprobar el paquete
        run: |
          if (!(Test-Path dist\Jeronimo\Jeronimo.exe)) { exit 1 }
          if (!(Get-ChildItem -Recurse dist\Jeronimo -Filter logo.svg)) { exit 1 }
          if (!(Get-ChildItem -Recurse dist\Jeronimo -Filter EBGaramond.woff2)) { exit 1 }
          if (!(Get-ChildItem -Recurse dist\Jeronimo -Filter EBGaramond-SemiBold.ttf)) { exit 1 }
          if (!(Get-ChildItem -Recurse dist\Jeronimo -Filter en.json)) { exit 1 }
          if (!(Get-ChildItem -Recurse dist\Jeronimo -Filter pt.json)) { exit 1 }
      - name: Crear el instalador (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" packaging\instalador.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Versión portátil (ZIP)
        run: Compress-Archive -Path dist\Jeronimo\* -DestinationPath "dist\instalador\Jeronimo-$env:VERSION-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Jeronimo-Windows
          path: dist/instalador/*
      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publicar != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.publicar || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Jerónimo ${{ inputs.publicar || github.ref_name }}
          body_path: docs/versiones/${{ inputs.publicar || github.ref_name }}.md
          files: dist/instalador/*
