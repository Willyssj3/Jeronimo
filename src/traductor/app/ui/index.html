<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jerónimo — Traductor de libros</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preload" href="fonts/EBGaramond.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="logo.svg" alt="" width="38" height="38">
      <div class="brand-text"><span class="brand-name">Jerónimo</span><span class="brand-sub">Traductor de libros con IA</span></div>
    </div>
    <div id="project-name" class="project-name"></div>
    <div class="spacer"></div>
    <button id="btn-update" class="update-pill" hidden></button>
    <button id="btn-close-project" class="ghost" hidden>Cerrar proyecto</button>
    <button id="btn-quit" class="ghost" hidden>Salir</button>
  </header>

  <div class="layout">
    <nav id="sidebar" hidden>
      <div class="side-label">Proyecto</div>
      <a href="#resumen" data-view="resumen" title="Resumen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>
        <span>Resumen</span></a>
      <a href="#referencias" data-view="referencias" title="Referencias">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="4.5" height="16" rx="1"/><rect x="8" y="6.5" width="4.5" height="13.5" rx="1"/><path d="M13.6 7.4l4.1-1.1 3.4 12.8-4.1 1.1z"/><path d="M5.75 8v1.5M10.25 10v1.5"/></svg>
        <span>Referencias</span></a>
      <a href="#ia" data-view="ia" title="Inteligencia artificial">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3.5l1.9 5.1 5.1 1.9-5.1 1.9L11 17.5l-1.9-5.1L4 10.5l5.1-1.9z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>
        <span>Inteligencia artificial</span></a>
      <a href="#conocimiento" data-view="conocimiento" title="Estilo y glosario">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 3.8C13.2 4.2 8.6 8.9 7.6 16.4c6.8-.9 11.4-5.4 12.4-12.6z"/><path d="M4 20l9-9"/><path d="M10.4 13.6h4.2"/></svg>
        <span>Estilo y glosario</span></a>
      <a href="#capitulos" data-view="capitulos" title="Capítulos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.6C10 5.1 7 4.6 3.5 5v13.2c3.5-.4 6.5.1 8.5 1.6 2-1.5 5-2 8.5-1.6V5C17 4.6 14 5.1 12 6.6z"/><path d="M12 6.6v13.2"/></svg>
        <span>Capítulos</span></a>
      <a href="#calidad" data-view="calidad" title="Control de calidad">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l7 2.6v5.4c0 4.4-3 7.7-7 9-4-1.3-7-4.6-7-9V6.1z"/><path d="M8.8 12.2l2.2 2.2 4.4-4.6"/></svg>
        <span>Calidad</span></a>
      <a href="#buscar" data-view="buscar" title="Buscar y reemplazar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
        <span>Buscar</span></a>
      <a href="#exportar" data-view="exportar" title="Exportar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4"/><path d="M7.8 8.2L12 4l4.2 4.2"/><path d="M5 13v5.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V13"/></svg>
        <span>Exportar</span></a>
      <div class="side-foot" id="side-foot">
        <div class="row"><span class="muted small">Traducido</span><strong id="side-pct">0 %</strong></div>
        <div class="progress"><div id="side-bar"></div></div>
      </div>
    </nav>
    <main id="main" tabindex="-1"><div id="view" class="page"><p class="muted">Cargando…</p></div></main>
  </div>

  <footer id="taskbar" hidden>
    <div class="task-text"><strong id="task-name"></strong> <span id="task-message"></span></div>
    <div class="progress"><div id="task-bar"></div></div>
    <button id="btn-task-log" class="ghost small">Ver registro</button>
    <button id="btn-task-cancel" class="small danger">Detener</button>
  </footer>

  <div id="toast" role="status" aria-live="polite"></div>

  <div id="modal-backdrop" hidden>
    <div id="modal" role="dialog" aria-modal="true">
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="ghost">Cancelar</button>
        <button id="modal-ok">Aceptar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
