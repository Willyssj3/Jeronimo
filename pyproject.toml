[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "traductor-de-libros"
dynamic = ["version"]
description = "Jerónimo: traductor de libros EPUB con IA que imita el estilo de las traducciones oficiales del autor."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Willyssj3 y colaboradores" }]
dependencies = [
    "lxml>=5.0",
    "anthropic>=1.13",
    "openai>=1.40",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "reportlab>=4",
]

[project.optional-dependencies]
escritorio = ["pywebview>=5.0", "keyring>=24"]
dev = ["pytest>=8"]

[project.scripts]
traductor = "traductor.cli:main"
traductor-app = "traductor.app.main:main"
jeronimo = "traductor.app.main:main"

[tool.setuptools.dynamic]
version = { attr = "traductor.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"traductor" = ["assets/fonts/*"]
"traductor.app" = ["ui/*", "ui/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
